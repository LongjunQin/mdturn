<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>MD 阅读 + 批注</title>
<link rel="stylesheet" href="/static/vendor/katex.min.css">
<link rel="stylesheet" href="/static/vendor/highlight-github.min.css">
<link rel="stylesheet" href="/static/app.css?v=annotation-edit-v1">
</head>
<body>
  <header id="topbar">
    <button id="btnMenu" type="button" aria-label="文件列表" aria-controls="drawer" aria-expanded="false">☰ 文件</button>
    <div id="docTitle">选择文档</div>
    <button id="submitReview" type="button" hidden>完成本轮审阅</button>
    <button id="btnNotes" type="button" aria-label="批注列表，0条未处理，共0条" aria-controls="notesPanel" aria-expanded="false">批注 <span id="noteCount">0</span></button>
  </header>

  <div id="reviewBanner" hidden role="status" aria-live="polite">
    <span id="reviewState"></span>
    <span id="reviewHint"></span>
  </div>

  <aside id="drawer" aria-label="Markdown 文件列表" aria-hidden="true" inert>
    <div class="drawer-h">文档列表</div>
    <div id="fileList"></div>
  </aside>
  <div id="drawerMask" hidden></div>

  <main id="content"><div class="empty">← 点左上角「☰ 文件」选一篇文档</div></main>

  <button id="annotBtn" type="button" hidden>＋ 批注选中内容</button>

  <div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true" inert hidden>
    <h2 id="sheetTitle" class="sheet-title">添加批注</h2>
    <div id="sheetQuote"></div>
    <label class="sr-only" for="sheetText">批注内容</label>
    <textarea id="sheetText" placeholder="写下你的批注:这段/这张图哪里要改、要加强什么…"></textarea>
    <div id="sheetActions">
      <button id="sheetCancel" type="button">取消</button>
      <button id="sheetSave" type="button">保存批注</button>
    </div>
  </div>

  <aside id="notesPanel" role="dialog" aria-modal="true" aria-labelledby="notesTitle" aria-hidden="true" inert>
    <div class="notes-h"><span id="notesTitle">本篇批注</span>
      <label class="filter"><input type="checkbox" id="filterOpen"> 只看未处理</label>
      <button id="notesClose" type="button">关闭</button></div>
    <div id="notesList"></div>
  </aside>
  <div id="notesMask" hidden></div>

  <script src="/static/vendor/markdown-it.min.js"></script>
  <script src="/static/vendor/katex.min.js"></script>
  <script src="/static/vendor/texmath.min.js"></script>
  <script src="/static/vendor/highlight.min.js"></script>
  <script src="/static/vendor/mermaid.min.js"></script>
  <script src="/static/app.js?v=fenced-code-selection-v1"></script>
</body>
</html>
