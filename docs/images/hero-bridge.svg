<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="-apple-system, PingFang SC, sans-serif">
  <defs>
    <marker id="arrow-blue-left" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto">
      <path d="M10 0 L0 5 L10 10 Z" fill="#0071e3"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#e8590c"/>
    </marker>
    <marker id="arrow-green-left" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto">
      <path d="M10 0 L0 5 L10 10 Z" fill="#1aa260"/>
    </marker>
    <filter id="card-shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#466079" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="880" height="470" rx="20" fill="#f5f7fa"/>

  <!-- Daily deliverables flowing from the AI agent to you -->
  <text x="440" y="29" text-anchor="middle" font-size="15" font-weight="600" fill="#515154">FINISHED WORK, READY FOR YOUR REVIEW</text>
  <path d="M802 83 H190" fill="none" stroke="#8ebceb" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 8" marker-end="url(#arrow-blue-left)"/>

  <g filter="url(#card-shadow)">
    <rect x="214" y="49" width="174" height="68" rx="12" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.5"/>
    <path d="M231 63 H249 L257 71 V101 H231 Z" fill="#e7f2ff" stroke="#0071e3" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="M249 63 V71 H257" fill="none" stroke="#0071e3" stroke-width="1.7" stroke-linejoin="round"/>
    <text x="270" y="77" font-size="15" font-weight="700" fill="#1d1d1f">Project</text>
    <text x="270" y="98" font-size="15" fill="#515154">proposal</text>
  </g>

  <g filter="url(#card-shadow)">
    <rect x="404" y="42" width="174" height="68" rx="12" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.5"/>
    <path d="M421 56 H439 L447 64 V94 H421 Z" fill="#e7f2ff" stroke="#0071e3" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="M439 56 V64 H447" fill="none" stroke="#0071e3" stroke-width="1.7" stroke-linejoin="round"/>
    <text x="460" y="70" font-size="15" font-weight="700" fill="#1d1d1f">Execution</text>
    <text x="460" y="91" font-size="15" fill="#515154">plan</text>
  </g>

  <g filter="url(#card-shadow)">
    <rect x="594" y="49" width="174" height="68" rx="12" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.5"/>
    <path d="M611 63 H629 L637 71 V101 H611 Z" fill="#e7f2ff" stroke="#0071e3" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="M629 63 V71 H637" fill="none" stroke="#0071e3" stroke-width="1.7" stroke-linejoin="round"/>
    <text x="650" y="77" font-size="15" font-weight="700" fill="#1d1d1f">Research</text>
    <text x="650" y="98" font-size="15" fill="#515154">report</text>
  </g>

  <!-- You -->
  <rect x="28" y="139" width="170" height="194" rx="18" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.5"/>
  <rect x="47" y="156" width="48" height="26" rx="13" fill="#e7f2ff"/>
  <text x="71" y="174" text-anchor="middle" font-size="15" font-weight="700" fill="#0071e3">YOU</text>
  <circle cx="113" cy="221" r="24" fill="#e7f2ff" stroke="#0071e3" stroke-width="2.5"/>
  <circle cx="113" cy="212" r="8" fill="#ffffff" stroke="#0071e3" stroke-width="2.2"/>
  <path d="M96 235 Q113 219 130 235" fill="#ffffff" stroke="#0071e3" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M82 269 L93 280 L112 258" fill="none" stroke="#1aa260" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="113" y="304" text-anchor="middle" font-size="18" font-weight="700" fill="#1d1d1f">Your judgment</text>
  <text x="113" y="324" text-anchor="middle" font-size="15" fill="#515154">Read the whole thing</text>

  <!-- AI agent -->
  <rect x="682" y="139" width="170" height="194" rx="18" fill="#ffffff" stroke="#9ed9b4" stroke-width="1.5"/>
  <rect x="701" y="156" width="86" height="26" rx="13" fill="#e5f7eb"/>
  <text x="744" y="174" text-anchor="middle" font-size="15" font-weight="700" fill="#1aa260">AI AGENT</text>
  <circle cx="767" cy="221" r="24" fill="#e5f7eb" stroke="#1aa260" stroke-width="2.5"/>
  <rect x="746" y="204" width="42" height="34" rx="8" fill="#ffffff" stroke="#1aa260" stroke-width="2.2"/>
  <line x1="767" y1="197" x2="767" y2="204" stroke="#1aa260" stroke-width="2.2"/>
  <circle cx="767" cy="194" r="3.5" fill="#1aa260"/>
  <circle cx="759" cy="219" r="3" fill="#1aa260"/>
  <circle cx="775" cy="219" r="3" fill="#1aa260"/>
  <path d="M757 229 Q767 235 777 229" fill="none" stroke="#1aa260" stroke-width="2.2" stroke-linecap="round"/>
  <text x="767" y="304" text-anchor="middle" font-size="18" font-weight="700" fill="#1d1d1f">Fast drafts</text>
  <text x="767" y="324" text-anchor="middle" font-size="15" fill="#515154">Apply every note</text>

  <!-- The bridge -->
  <path d="M188 302 H692" fill="none" stroke="#0071e3" stroke-width="5" stroke-linecap="round"/>
  <path d="M214 302 V184 M666 302 V184" fill="none" stroke="#0071e3" stroke-width="7" stroke-linecap="round"/>
  <path d="M214 201 Q440 137 666 201" fill="none" stroke="#8ebceb" stroke-width="3"/>
  <path d="M214 201 Q440 265 666 201" fill="none" stroke="#c9d6e6" stroke-width="2"/>
  <path d="M287 182 V204 M365 166 V204 M440 159 V204 M515 166 V204 M593 182 V204" fill="none" stroke="#8ebceb" stroke-width="2"/>
  <rect x="205" y="202" width="470" height="101" rx="16" fill="#ffffff" stroke="#0071e3" stroke-width="2.5"/>
  <rect x="384" y="187" width="112" height="34" rx="17" fill="#0071e3"/>
  <text x="440" y="210" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">MDTurn</text>

  <line x1="260" y1="246" x2="620" y2="246" stroke="#e8590c" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
  <rect x="311" y="229" width="258" height="32" rx="16" fill="#fff0e6"/>
  <text x="440" y="251" text-anchor="middle" font-size="16" font-weight="700" fill="#e8590c">Word-level annotations →</text>

  <line x1="620" y1="280" x2="260" y2="280" stroke="#1aa260" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-green-left)"/>
  <rect x="294" y="264" width="292" height="32" rx="16" fill="#e5f7eb"/>
  <text x="440" y="286" text-anchor="middle" font-size="16" font-weight="700" fill="#1aa260">← Everything fixed in one pass</text>

  <!-- The old way, deliberately muted -->
  <g opacity="0.58">
    <path d="M55 357 H266 Q278 357 278 369 V393 Q278 405 266 405 H122 L105 419 V405 H55 Q43 405 43 393 V369 Q43 357 55 357 Z" fill="#ffffff" stroke="#9b9ba0" stroke-width="1.8" stroke-dasharray="5 4"/>
    <text x="160" y="387" text-anchor="middle" font-size="15" fill="#515154">“Fix the third paragraph…?”</text>
    <line x1="48" y1="411" x2="274" y2="351" stroke="#e8590c" stroke-width="2.5" stroke-linecap="round"/>
    <text x="160" y="439" text-anchor="middle" font-size="15" font-weight="600" fill="#515154">VAGUE CHAT — THE OLD WAY</text>
  </g>

  <!-- Punchline -->
  <rect x="330" y="362" width="506" height="70" rx="18" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.5"/>
  <text x="583" y="404" text-anchor="middle" font-size="18" font-weight="700" fill="#1d1d1f">One reading · One batch of notes · One round of fixes</text>
</svg>
