<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="-apple-system, PingFang SC, sans-serif">
  <defs>
    <marker id="flow-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0071e3"/>
    </marker>
  </defs>

  <rect width="880" height="470" rx="20" fill="#f5f7fa"/>
  <text x="440" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#1d1d1f">MDTurn 是什么？</text>
  <text x="440" y="77" text-anchor="middle" font-size="16" fill="#515154">从写稿、批注到改好，一轮审阅清清楚楚</text>

  <!-- Step 1 -->
  <rect x="28" y="108" width="250" height="322" rx="18" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.5"/>
  <rect x="48" y="126" width="54" height="28" rx="14" fill="#e7f2ff"/>
  <text x="75" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#0071e3">第 1 步</text>

  <circle cx="153" cy="202" r="42" fill="#e7f2ff"/>
  <!-- Robot -->
  <rect x="113" y="177" width="49" height="43" rx="9" fill="#ffffff" stroke="#0071e3" stroke-width="2.5"/>
  <line x1="137.5" y1="169" x2="137.5" y2="177" stroke="#0071e3" stroke-width="2.5"/>
  <circle cx="137.5" cy="166" r="4" fill="#0071e3"/>
  <circle cx="128" cy="196" r="3.5" fill="#0071e3"/>
  <circle cx="147" cy="196" r="3.5" fill="#0071e3"/>
  <path d="M126 207 Q137.5 214 149 207" fill="none" stroke="#0071e3" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="108" y1="192" x2="113" y2="192" stroke="#0071e3" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="162" y1="192" x2="167" y2="192" stroke="#0071e3" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Document -->
  <path d="M164 190 H187 L198 201 V231 H164 Z" fill="#ffffff" stroke="#0071e3" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M187 190 V201 H198" fill="none" stroke="#0071e3" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="172" y1="210" x2="190" y2="210" stroke="#8ebceb" stroke-width="2" stroke-linecap="round"/>
  <line x1="172" y1="218" x2="190" y2="218" stroke="#8ebceb" stroke-width="2" stroke-linecap="round"/>

  <text x="153" y="273" text-anchor="middle" font-size="21" font-weight="700" fill="#1d1d1f">AI 帮你写文档</text>
  <text x="153" y="305" text-anchor="middle" font-size="16" fill="#515154">Codex、Claude 等 AI</text>
  <text x="153" y="330" text-anchor="middle" font-size="16" fill="#515154">先把初稿准备好</text>
  <rect x="68" y="365" width="170" height="38" rx="10" fill="#e7f2ff"/>
  <text x="153" y="390" text-anchor="middle" font-size="15" font-weight="600" fill="#0071e3">初稿准备完成</text>

  <!-- Arrow 1 -->
  <line x1="286" y1="269" x2="307" y2="269" stroke="#0071e3" stroke-width="3" stroke-linecap="round" marker-end="url(#flow-arrow)"/>

  <!-- Step 2 -->
  <rect x="315" y="108" width="250" height="322" rx="18" fill="#ffffff" stroke="#f1a06d" stroke-width="2"/>
  <rect x="335" y="126" width="54" height="28" rx="14" fill="#fff0e6"/>
  <text x="362" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#e8590c">第 2 步</text>

  <circle cx="440" cy="202" r="42" fill="#fff0e6"/>
  <!-- Highlighted text sheet -->
  <rect x="392" y="172" width="67" height="64" rx="7" fill="#ffffff" stroke="#e8590c" stroke-width="2.5"/>
  <line x1="403" y1="186" x2="448" y2="186" stroke="#b7b7ba" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="401" y="194" width="40" height="10" rx="3" fill="#ffd8a8"/>
  <line x1="403" y1="213" x2="448" y2="213" stroke="#b7b7ba" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="403" y1="222" x2="438" y2="222" stroke="#b7b7ba" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Comment bubble -->
  <path d="M452 183 H480 Q487 183 487 190 V210 Q487 217 480 217 H469 L461 225 V217 H452 Q445 217 445 210 V190 Q445 183 452 183 Z" fill="#ffffff" stroke="#e8590c" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="457" cy="200" r="2.5" fill="#e8590c"/>
  <circle cx="466" cy="200" r="2.5" fill="#e8590c"/>
  <circle cx="475" cy="200" r="2.5" fill="#e8590c"/>
  <!-- Red pen -->
  <path d="M462 229 L482 209 L489 216 L469 236 L458 239 Z" fill="#ffffff" stroke="#e8590c" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M458 239 L469 236 L462 229 Z" fill="#e8590c"/>

  <text x="440" y="273" text-anchor="middle" font-size="21" font-weight="700" fill="#1d1d1f">你划词写批注</text>
  <text x="440" y="305" text-anchor="middle" font-size="16" fill="#515154">像老师批改作文一样</text>
  <text x="440" y="330" text-anchor="middle" font-size="16" fill="#515154">哪里要改，就批在哪里</text>
  <rect x="354" y="365" width="172" height="38" rx="10" fill="#fff0e6"/>
  <path d="M375 379 V376 A7 7 0 0 1 389 376 V379" fill="none" stroke="#e8590c" stroke-width="2"/>
  <rect x="373" y="379" width="18" height="14" rx="3" fill="#ffffff" stroke="#e8590c" stroke-width="2"/>
  <text x="458" y="390" text-anchor="middle" font-size="15" font-weight="600" fill="#e8590c">原文已锁定，改不乱</text>

  <!-- Arrow 2 -->
  <line x1="573" y1="269" x2="594" y2="269" stroke="#0071e3" stroke-width="3" stroke-linecap="round" marker-end="url(#flow-arrow)"/>

  <!-- Step 3 -->
  <rect x="602" y="108" width="250" height="322" rx="18" fill="#ffffff" stroke="#9ed9b4" stroke-width="1.5"/>
  <rect x="622" y="126" width="54" height="28" rx="14" fill="#e5f7eb"/>
  <text x="649" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#1aa260">第 3 步</text>

  <circle cx="727" cy="202" r="42" fill="#e5f7eb"/>
  <!-- Robot -->
  <rect x="675" y="180" width="43" height="39" rx="8" fill="#ffffff" stroke="#1aa260" stroke-width="2.5"/>
  <line x1="696.5" y1="173" x2="696.5" y2="180" stroke="#1aa260" stroke-width="2.5"/>
  <circle cx="696.5" cy="170" r="3.5" fill="#1aa260"/>
  <circle cx="688" cy="197" r="3" fill="#1aa260"/>
  <circle cx="705" cy="197" r="3" fill="#1aa260"/>
  <path d="M687 207 Q696.5 213 706 207" fill="none" stroke="#1aa260" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Checklist -->
  <rect x="723" y="172" width="58" height="65" rx="7" fill="#ffffff" stroke="#1aa260" stroke-width="2.5"/>
  <path d="M734 188 L738 192 L745 183" fill="none" stroke="#1aa260" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="751" y1="188" x2="770" y2="188" stroke="#8bcba3" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M734 205 L738 209 L745 200" fill="none" stroke="#1aa260" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="751" y1="205" x2="770" y2="205" stroke="#8bcba3" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M734 222 L738 226 L745 217" fill="none" stroke="#1aa260" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="751" y1="222" x2="770" y2="222" stroke="#8bcba3" stroke-width="2.5" stroke-linecap="round"/>

  <text x="727" y="273" text-anchor="middle" font-size="21" font-weight="700" fill="#1d1d1f">AI 按批注逐条改好</text>
  <text x="727" y="305" text-anchor="middle" font-size="16" fill="#515154">每条批注都照着处理</text>
  <text x="727" y="330" text-anchor="middle" font-size="16" fill="#515154">改过什么一目了然</text>
  <rect x="642" y="365" width="170" height="38" rx="10" fill="#e5f7eb"/>
  <path d="M660 384 A9 9 0 1 1 667 393" fill="none" stroke="#1aa260" stroke-width="2" stroke-linecap="round"/>
  <path d="M659 378 L660 384 L666 383" fill="none" stroke="#1aa260" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="737" y="390" text-anchor="middle" font-size="15" font-weight="600" fill="#1aa260">改完自动刷新</text>
</svg>
