<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" font-family="-apple-system, PingFang SC, sans-serif">
  <defs>
    <marker id="step-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#9bbfe5"/>
    </marker>
  </defs>

  <rect width="880" height="520" rx="20" fill="#f5f7fa"/>
  <text x="440" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#1d1d1f">Get started in four steps</text>
  <text x="440" y="77" text-anchor="middle" font-size="16" fill="#515154">No technical skills needed</text>

  <!-- Connecting line -->
  <line x1="99" y1="124" x2="267" y2="124" stroke="#9bbfe5" stroke-width="3" marker-end="url(#step-arrow)"/>
  <line x1="311" y1="124" x2="479" y2="124" stroke="#9bbfe5" stroke-width="3" marker-end="url(#step-arrow)"/>
  <line x1="523" y1="124" x2="691" y2="124" stroke="#9bbfe5" stroke-width="3" marker-end="url(#step-arrow)"/>

  <!-- Step 1 -->
  <rect x="26" y="149" width="192" height="319" rx="18" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.5"/>
  <circle cx="74" cy="124" r="28" fill="#0071e3" stroke="#f5f7fa" stroke-width="6"/>
  <text x="74" y="133" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">1</text>

  <circle cx="122" cy="213" r="40" fill="#e7f2ff"/>
  <!-- Download icon -->
  <path d="M122 183 V221" stroke="#0071e3" stroke-width="4" stroke-linecap="round"/>
  <path d="M108 210 L122 224 L136 210" fill="none" stroke="#0071e3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M97 232 V240 H147 V232" fill="none" stroke="#0071e3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="122" y="282" text-anchor="middle" font-size="18" font-weight="700" fill="#1d1d1f">Download &amp; install</text>
  <text x="122" y="319" text-anchor="middle" font-size="16" fill="#515154">Put MDTurn</text>
  <text x="122" y="345" text-anchor="middle" font-size="16" fill="#515154">on your computer</text>
  <rect x="55" y="389" width="134" height="38" rx="10" fill="#e7f2ff"/>
  <text x="122" y="414" text-anchor="middle" font-size="15" font-weight="600" fill="#0071e3">Install once</text>

  <!-- Step 2 -->
  <rect x="238" y="149" width="192" height="319" rx="18" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.5"/>
  <circle cx="286" cy="124" r="28" fill="#0071e3" stroke="#f5f7fa" stroke-width="6"/>
  <text x="286" y="133" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">2</text>

  <circle cx="334" cy="213" r="40" fill="#e7f2ff"/>
  <!-- Open document icon -->
  <path d="M304 190 H331 L339 199 H364 V238 H304 Z" fill="#ffffff" stroke="#0071e3" stroke-width="3" stroke-linejoin="round"/>
  <path d="M304 202 H364" stroke="#0071e3" stroke-width="3"/>
  <text x="334" y="226" text-anchor="middle" font-size="15" font-weight="700" fill="#0071e3">.md</text>
  <path d="M351 180 V193 M344 187 H358" stroke="#0071e3" stroke-width="2.5" stroke-linecap="round"/>

  <text x="334" y="282" text-anchor="middle" font-size="18" font-weight="700" fill="#1d1d1f">Open a document</text>
  <text x="334" y="319" text-anchor="middle" font-size="15" fill="#515154">Double-click the .md file</text>
  <text x="334" y="345" text-anchor="middle" font-size="15" fill="#515154">or ask your AI to open it</text>
  <rect x="267" y="389" width="134" height="38" rx="10" fill="#e7f2ff"/>
  <path d="M283 404 L289 410 L299 398" fill="none" stroke="#0071e3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="350" y="414" text-anchor="middle" font-size="15" font-weight="600" fill="#0071e3">Review ready</text>

  <!-- Step 3 -->
  <rect x="450" y="149" width="192" height="319" rx="18" fill="#ffffff" stroke="#f1a06d" stroke-width="2"/>
  <circle cx="498" cy="124" r="28" fill="#e8590c" stroke="#f5f7fa" stroke-width="6"/>
  <text x="498" y="133" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">3</text>

  <circle cx="546" cy="213" r="40" fill="#fff0e6"/>
  <!-- Highlight and pen icon -->
  <rect x="510" y="181" width="51" height="59" rx="6" fill="#ffffff" stroke="#e8590c" stroke-width="2.5"/>
  <line x1="519" y1="194" x2="552" y2="194" stroke="#b7b7ba" stroke-width="2" stroke-linecap="round"/>
  <rect x="517" y="202" width="31" height="9" rx="3" fill="#ffd8a8"/>
  <line x1="519" y1="219" x2="550" y2="219" stroke="#b7b7ba" stroke-width="2" stroke-linecap="round"/>
  <path d="M554 225 L574 205 L581 212 L561 232 L550 235 Z" fill="#ffffff" stroke="#e8590c" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M550 235 L561 232 L554 225 Z" fill="#e8590c"/>

  <text x="546" y="282" text-anchor="middle" font-size="16" font-weight="700" fill="#1d1d1f">Select text, write notes</text>
  <text x="546" y="316" text-anchor="middle" font-size="15" fill="#515154">Mark the exact words</text>
  <text x="546" y="342" text-anchor="middle" font-size="15" fill="#515154">then press the button</text>
  <rect x="471" y="383" width="150" height="44" rx="10" fill="#e8590c"/>
  <path d="M486 405 L491 410 L499 400" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="556" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">
    <tspan x="556" y="402">Finish this </tspan>
    <tspan x="556" y="419">review round</tspan>
  </text>

  <!-- Step 4 -->
  <rect x="662" y="149" width="192" height="319" rx="18" fill="#ffffff" stroke="#8bcba3" stroke-width="2"/>
  <circle cx="710" cy="124" r="28" fill="#1aa260" stroke="#f5f7fa" stroke-width="6"/>
  <text x="710" y="133" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">4</text>

  <circle cx="758" cy="213" r="40" fill="#e5f7eb"/>
  <!-- Chat bubble and cup icon -->
  <path d="M716 180 H776 Q785 180 785 189 V213 Q785 222 776 222 H748 L737 232 V222 H716 Q707 222 707 213 V189 Q707 180 716 180 Z" fill="#ffffff" stroke="#1aa260" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="726" cy="201" r="3" fill="#1aa260"/>
  <circle cx="737" cy="201" r="3" fill="#1aa260"/>
  <circle cx="748" cy="201" r="3" fill="#1aa260"/>
  <path d="M770 227 H791 V241 Q791 249 783 249 H778 Q770 249 770 241 Z" fill="#ffffff" stroke="#1aa260" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M791 231 H797 Q802 231 802 236 Q802 241 797 241 H791" fill="none" stroke="#1aa260" stroke-width="2.5"/>
  <path d="M774 219 C770 215 779 212 775 207" fill="none" stroke="#1aa260" stroke-width="2" stroke-linecap="round"/>

  <text x="758" y="282" text-anchor="middle" font-size="18" font-weight="700" fill="#1d1d1f">Tell your AI:</text>
  <text x="758" y="316" text-anchor="middle" font-size="15" fill="#515154">Use this instruction</text>
  <rect x="681" y="329" width="154" height="38" rx="10" fill="#e5f7eb"/>
  <text x="758" y="354" text-anchor="middle" font-size="16" font-weight="700" fill="#1aa260">“Apply my notes”</text>
  <text x="758" y="397" text-anchor="middle" font-size="15" fill="#515154">Grab a coffee; come back</text>
  <text x="758" y="422" text-anchor="middle" font-size="15" fill="#515154">to the new version</text>

  <rect x="286" y="489" width="308" height="23" rx="11.5" fill="#d8e9fb"/>
  <text x="440" y="506" text-anchor="middle" font-size="15" font-weight="600" fill="#0071e3" textLength="282" lengthAdjust="spacingAndGlyphs">Install once — every later round is just 2 → 3 → 4</text>
</svg>
